[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra"
version = "0.1.0"
description = "Sutra Press: Manuscript Conversion Engine"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "lxml>=5.0",
    "python-docx>=1.0.0",
    "Jinja2>=3.0.0",
    "click>=8.0.0",
    "pypandoc>=1.11",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "cryptography>=42.0.0",
    "httpx>=0.25.0",
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pdfplumber>=0.10.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
sutra = "sutra.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sutra*"]
